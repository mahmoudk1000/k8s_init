---
- name: Pre-flight Configuration Validation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate CNI plugin selection
      ansible.builtin.assert:
        that: ["cni_plugin in ['flannel', 'calico', 'cilium']"]
        fail_msg: >-
          Invalid CNI plugin '{{ cni_plugin }}' selected.
          Only one CNI plugin can be chosen. Valid options are: flannel, calico,
          or cilium.
        success_msg: 'CNI plugin validation passed: {{ cni_plugin }}'
      when: install_cni | default(true) | bool
- name: Prep Nodes
  hosts: cluster
  become: true
  become_method: ansible.builtin.sudo
  roles: [foundation]
- name: Initialize Primary Control Plane
  hosts: control_plane[0]
  roles: [init_master, post_master]
- name: Join Additional Control Planes and Workers
  hosts: control_plane:workers:!control_plane[0]
  become: true
  become_method: ansible.builtin.sudo
  roles: [init_node, post_node]
