---
- name: Generate a token for joining worker nodes
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: kube_join_command
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
- name: Store the worker join command
  ansible.builtin.set_fact:
    join_command: '{{ kube_join_command.stdout }}'
  delegate_to: '{{ item }}'
  delegate_facts: true
  loop: "{{ groups['cluster'] }}"
  run_once: true
- name: Generate certificate key for control plane join
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  register: certificate_key_output
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  when:
    - control_plane_endpoint | length > 0
    - groups['control_plane'] | length > 1
- name: Extract certificate key
  ansible.builtin.set_fact:
    certificate_key: '{{ certificate_key_output.stdout_lines[-1] }}'
  run_once: true
  when:
    - control_plane_endpoint | length > 0
    - groups['control_plane'] | length > 1
    - certificate_key_output is defined
- name: Store the control plane join command
  ansible.builtin.set_fact:
    join_command_control_plane: '{{ kube_join_command.stdout }} --control-plane
      --certificate-key {{ certificate_key }}'
  delegate_to: '{{ item }}'
  delegate_facts: true
  loop: "{{ groups['cluster'] }}"
  run_once: true
  when:
    - control_plane_endpoint | length > 0
    - groups['control_plane'] | length > 1
    - certificate_key is defined
